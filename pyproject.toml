[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nldbwrite-v3"
version = "0.2.6"
description = "Dual-mode mapping-first verified planning for natural-language database writes"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9"]

[project.scripts]
nldbwrite-v3 = "nldbwrite_v3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
markers = [
  "integration: validates a complete packaged reviewer release",
  "slow: long-running deterministic reproduction",
]
